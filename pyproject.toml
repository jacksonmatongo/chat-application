[project]
name = "chat-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jackson Matongo", email = "jacksonfmatongo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
chat-app = "chat_app:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"
